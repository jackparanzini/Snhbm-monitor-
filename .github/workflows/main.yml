name: Atualizar Dados SNHBM

on:
  schedule:
    - cron: '0 7 * * *'  # 08:00 em Luxemburgo
    - cron: '0 14 * * *' # 15:00 em Luxemburgo
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Python Setup
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: pip install requests beautifulsoup4

      - name: Rodar Verificação
        run: python monitor.py || python Monitor.py

      - name: Salvar Dados
        run: |
          git config --global user.name 'SNHBM Bot'
          git config --global user.email 'bot@snhbm.local'
          git add estado_anterior.json
          git diff-index --quiet HEAD || git commit -m "Atualização automática dos imóveis SNHBM"
          git push
